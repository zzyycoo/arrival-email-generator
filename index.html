<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Arrival Email Generator</title>
<style>
:root{--bg:#f3f5f4;--surface:#fff;--ink:#1d2a26;--muted:#62706b;--line:#d5dcd9;--accent:#1f5c4d;--accent-ink:#fff;--warn:#a3341f;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121917;--surface:#1b2420;--ink:#e6eeea;--muted:#92a39c;--line:#33423c;--accent:#5fb89f;--accent-ink:#0c1512;--warn:#ff9b86}}
:root[data-theme="dark"]{--bg:#121917;--surface:#1b2420;--ink:#e6eeea;--muted:#92a39c;--line:#33423c;--accent:#5fb89f;--accent-ink:#0c1512;--warn:#ff9b86}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Segoe UI",system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 18px 60px}
h1{font-size:22px;margin:0 0 4px;font-weight:650}
.sub{color:var(--muted);margin:0 0 22px}
.ver{font-size:12px;font-weight:500;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:1px 8px;margin-left:8px;vertical-align:middle}
h2{font-size:17px;margin:0 0 12px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;margin-bottom:18px}
label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
input{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px}
input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.code{max-width:240px;margin-bottom:16px}
.guest{display:grid;grid-template-columns:2fr 1.7fr .9fr auto;gap:10px;align-items:end;padding:12px 0 2px;border-top:1px solid var(--line)}
.guest:first-of-type{border-top:0;padding-top:0}
.dt{display:flex;gap:6px;align-items:flex-start}
.dt>div{flex:1;min-width:0}
.dt input{padding:8px 4px;text-align:center}
.dt .sep{align-self:center;padding-top:8px;color:var(--muted);font-size:13px}
.dt small{display:block;font-size:11px;color:var(--muted);margin-top:3px;line-height:1.2}
.dt.bad input{border-color:var(--warn);background:color-mix(in srgb,var(--warn) 8%,var(--bg))}
.dt.bad small{color:var(--warn)}
.hint{font-size:12px;color:var(--warn);margin-top:6px;display:none}
.hint.on{display:block}
.group{background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:0 14px 10px;margin-bottom:12px;position:relative}
.group>.ghead{display:flex;align-items:center;gap:8px;padding:10px 0 4px;border-bottom:1px solid var(--line);margin-bottom:4px}
.group>.ghead .num{font-weight:650;font-size:14px;color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent);border-radius:999px;padding:1px 10px;white-space:nowrap}
.group>.ghead .glabel{font-size:13px;color:var(--muted)}
.group>.ghead .sp{flex:1}
.group>.ghead .rm{border:none;background:none;color:var(--muted);cursor:pointer;font-size:18px;line-height:1;padding:2px 6px;border-radius:5px}
.group>.ghead .rm:hover{color:var(--warn);background:color-mix(in srgb,var(--warn) 10%,transparent)}
.group>.shared{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:end;padding:10px 0 6px;border-bottom:1px dashed var(--line);margin-bottom:2px}
.group>.shared .note{font-size:12px;color:var(--muted);margin:0}
.langbar{position:absolute;top:12px;right:0;display:flex;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px;z-index:5}
.langbar button{border:none;background:none;font:inherit;font-size:13px;color:var(--muted);padding:4px 11px;border-radius:999px;cursor:pointer;white-space:nowrap}
.langbar button:hover{color:var(--ink)}
.langbar button.on{background:var(--accent);color:#fff;font-weight:600}
main{position:relative}
.rm{background:none;border:1px solid var(--line);color:var(--muted);border-radius:6px;height:38px;width:38px;cursor:pointer;font-size:18px}
.rm:hover{color:var(--warn);border-color:var(--warn)}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
button.btn{font:inherit;font-weight:600;border-radius:7px;padding:9px 18px;cursor:pointer;border:1px solid var(--accent);background:transparent;color:var(--accent)}
button.primary{background:var(--accent);color:var(--accent-ink)}
button:disabled{opacity:.45;cursor:not-allowed}
.err{color:var(--warn);min-height:20px;margin-top:10px;font-size:14px}
.meta{font-size:14px;margin-bottom:12px}
.meta div{margin-bottom:2px}.meta b{color:var(--muted);font-weight:500;display:inline-block;min-width:64px}
.paper{background:#fff;color:#111;border:1px solid var(--line);border-radius:6px;padding:16px;overflow-x:auto}
.paper table{border-collapse:collapse;width:100%;min-width:560px;font-family:Calibri,Arial,sans-serif;font-size:14px;color:#111}
.paper th,.paper td{border:1px solid #333;padding:8px 10px;text-align:center}
.paper th{font-weight:700}.paper th i{display:block;font-weight:400}
.note{font-size:13px;color:var(--muted);margin-top:10px}
.hide{display:none}
@media (max-width:700px){.guest{grid-template-columns:1fr 1fr}.guest>.n{grid-column:1/-1}.guest>.dt-wrap{grid-column:1/-1}.group>.shared{grid-template-columns:1fr 1fr}}
.foot{max-width:1080px;margin:0 auto;padding:0 18px 26px}
.rs{font-size:11px;color:#888}
.rs.ok{color:#1e8e5a}
.rs.bad{color:#c0392b}
.diagbtn{margin-left:12px;font-size:11px;padding:2px 9px;border:1px solid #ddd;border-radius:10px;background:#fff;cursor:pointer;color:#666}
.diagbtn:hover{background:#f2f2f2}
.diagout{white-space:pre-line}
</style>

let LANG = localStorage.getItem("aeg_lang") || "zh";
// t("key") or t("key", {m: 13}) to fill {placeholders}.
function t(key, vars){
  const s = (I18N[LANG] && I18N[LANG][key]) || (I18N.zh[key]) || key;
  if (!vars) return s;
  return s.replace(/\{(\w+)\}/g, (m, k) => (vars[k] !== undefined ? vars[k] : m));
}

// Apply the dictionary to every element carrying a data-i18n marker.
function applyI18n(){
  document.querySelectorAll("[data-i18n]").forEach(el => {
    const v = t(el.dataset.i18n);
    if (v) el.textContent = v;
  });
  document.querySelectorAll("[data-i18n-title]").forEach(el => {
    const v = t(el.dataset.i18nTitle);
    if (v) el.title = v;
  });
  document.querySelectorAll("[data-i18n-aria]").forEach(el => {
    const v = t(el.dataset.i18nAria);
    if (v) el.setAttribute("aria-label", v);
  });
  document.querySelectorAll("[data-i18n-ph]").forEach(el => {
    const v = t(el.dataset.i18nPh);
    if (v) el.placeholder = v;
  });
  document.querySelectorAll("#langbar button").forEach(b => {
    b.classList.toggle("on", b.dataset.lang === LANG);
  });
  // The date part unit labels live in the dynamically built rows.
  document.querySelectorAll(".dt").forEach(g => {
    const labels = g.querySelectorAll("small");
    const units = [t("unitDay"), t("unitMonth"), t("unitYear")];
    labels.forEach((s, i) => {
      if (!g.classList.contains("bad")) s.textContent = units[i];
    });
  });
  renumber();
}

$("langbar").querySelectorAll("button").forEach(b => {
  b.onclick = () => {
    LANG = b.dataset.lang;
    localStorage.setItem("aeg_lang", LANG);
    applyI18n();
    invalidate();
    // Rebuild the preview so the table headers follow the new language.
    if (current) { $("gen").click(); }
  };
});

// ---- Groups -------------------------------------------------------------
// A group is one arriving party. Everyone in it shares the arrival date and
// time, so those live on the group; each guest only needs a name and a
// birthday. Adding a guest creates a new group that inherits the arrival
// date and time of the group above it.

function isoToday(){
  const t = new Date();
  return `${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,"0")}-${String(t.getDate()).padStart(2,"0")}`;
}
function isoOneYear(){
  const t = new Date();
  const o = new Date(t.getFullYear() + 1, t.getMonth(), t.getDate());
  return `${o.getFullYear()}-${String(o.getMonth()+1).padStart(2,"0")}-${String(o.getDate()).padStart(2,"0")}`;
}

function addGroup(shared){
  const g = document.createElement("section");
  g.className = "group";
  g.innerHTML = `
    <div class="ghead">
      <span class="num"></span>
      <span class="glabel" data-i18n="groupLabel"></span>
      <span class="sp"></span>
      <button class="rm" type="button" data-i18n-title="delGroup" data-i18n-aria="delGroup" title="删除这一组" aria-label="删除这一组">×</button>
    </div>
    <div class="shared">
      <div><label data-i18n="arrivalDate"></label><input class="ad" type="date" min="${isoToday()}" max="${isoOneYear()}"></div>
      <div><label data-i18n="time"></label><input class="at" type="time"></div>
    </div>
    <div class="guests"></div>
    <div class="actions" style="margin:8px 0 0">
      <button class="btn" type="button" data-addguest data-i18n="addGuest"></button>
    </div>`;
  const guestsBox = g.querySelector(".guests");

  const mkGuest = () => {
    const row = document.createElement("div");
    row.className = "guest";
    row.innerHTML = guestRowHTML();
    row.querySelector(".rm").onclick = () => {
      if (guestsBox.children.length > 1) { row.remove(); invalidate(); }
    };
    bindDateInputs(row);
    bindNameInput(row.querySelector(".gn"));
    guestsBox.appendChild(row);
    return row;
  };

  mkGuest();

  g.querySelector("[data-addguest]").onclick = () => {
    const row = mkGuest();
    invalidate();
    const gn = row.querySelector(".gn");
    if (gn) gn.focus();
  };

  // Inherit the arrival date and time from the group above.
  if (shared){
    g.querySelector(".ad").value = shared.ad || "";
    g.querySelector(".at").value = shared.at || "";
  }

  g.querySelector(".rm").onclick = () => {
    if (rows.children.length > 1) { g.remove(); renumber(); invalidate(); }
  };
  rows.appendChild(g);
  renumber();
  // Fill in the labels for the language that is currently selected.
  g.querySelectorAll("[data-i18n]").forEach(el => {
    const v = t(el.dataset.i18n);
    if (v) el.textContent = v;
  });
  g.querySelectorAll("[data-i18n-title]").forEach(el => {
    const v = t(el.dataset.i18nTitle);
    if (v) el.title = v;
  });
  g.querySelectorAll("[data-i18n-aria]").forEach(el => {
    const v = t(el.dataset.i18nAria);
    if (v) el.setAttribute("aria-label", v);
  });
  g.querySelectorAll("[data-i18n-ph]").forEach(el => {
    const v = t(el.dataset.i18nPh);
    if (v) el.placeholder = v;
  });
  g.querySelectorAll(".dt").forEach(dt => {
    const units = [t("unitDay"), t("unitMonth"), t("unitYear")];
    dt.querySelectorAll("small").forEach((s, i) => { s.textContent = units[i]; });
  });
  return g;
}

// Capitalise a guest name in place while keeping the caret where it was.
// Names are typed in pinyin, so plain upper casing is enough; accented
// letters such as Á or É are handled by toUpperCase as well.
function toUpperCaseName(s){
  return s.toUpperCase();
}
function bindNameInput(input){
  input.addEventListener("input", () => {
    const start = input.selectionStart, end = input.selectionEnd;
    const before = input.value;
    const after = toUpperCaseName(before);
    if (after !== before){
      input.value = after;
      // Only restore the caret when the length is unchanged (no surrogate splits).
      if (before.length === after.length){
        try { input.setSelectionRange(start, end); } catch (e) {}
      }
    }
  });
  // Paste may not fire input on some browsers.
  input.addEventListener("paste", () => {
    setTimeout(() => { input.value = toUpperCaseName(input.value); }, 0);
  });
}

// ---- Usage reporting ----------------------------------------------------
// Fire-and-forget: a failed call must never disturb the tool.
// The reporting endpoint. Only addresses that actually resolve are listed:
// a beacon sent to a dead host is dropped silently, so a broken entry here
// would swallow every report.
const STATS_CANDIDATES = [
  "https://stats.godpleaseplease.online/api/log",
  "https://aeg-stats.xu1760.workers.dev/api/log",
];
let STATS_API = STATS_CANDIDATES[0];
let STATS_PROBED = false;

// Work out which host actually answers, then keep using it.
async function pickStatsApi(){
  if (STATS_PROBED) return STATS_API;
  for (const base of STATS_CANDIDATES){
    try {
      const res = await fetch(base.replace("/api/log", "/api/health"), { method: "GET", cache: "no-store" });
      if (res.ok){ STATS_API = base; STATS_PROBED = true; return base; }
    } catch (e) { /* try the next one */ }
  }
  STATS_PROBED = true;
  return STATS_API;
}

// A short random id kept in this browser, so the same person on the same
// device is counted once.
function deviceId(){
  const KEY = "aeg_device_id";
  let id = null;
  try { id = localStorage.getItem(KEY); } catch (e) {}
  if (!id){
    const rand = (typeof crypto !== "undefined" && crypto.randomUUID)
      ? crypto.randomUUID().replace(/-/g, "").slice(0, 6)
      : Math.random().toString(36).slice(2, 8);
    id = rand;
    try { localStorage.setItem(KEY, id); } catch (e) {}
  }
  return id;
}

// A readable device model: "iPhone", "Android", "Windows"...
function deviceModel(){
  const ua = navigator.userAgent || "";
  if (/iPhone/i.test(ua)) return "iPhone";
  if (/iPad/i.test(ua)) return "iPad";
  if (/Android/i.test(ua)) return "Android";
  if (/Macintosh|Mac OS X/i.test(ua)) return "Mac";
  if (/Windows/i.test(ua)) return "Windows";
  if (/Linux/i.test(ua)) return "Linux";
  return "Device";
}

// Keeps the outcome of the last report so the page can show whether the
// statistics are reaching the server.
let lastReport = { at: 0, ok: false, detail: "" };

function reportUsage(event, guests, groups){
  // Probe once in the background; the first reports may still use the
  // default address, which is fine.
  if (!STATS_PROBED) pickStatsApi();
  try {
    const payload = {
      event,
      device: `${deviceModel()}-${deviceId()}`,
      lang: LANG,
      code: ($("rc") && $("rc").value.trim()) || "",
      guests: guests || 0,
      groups: groups || 0,
      agent: navigator.userAgent || "",
    };
    const body = JSON.stringify(payload);
    // sendBeacon with a JSON blob would trigger a CORS preflight, which
    // some networks drop. A text/plain body is a simple request instead.
    // A beacon can also report success for a host that never receives the
    // request, so a plain fetch follows it as a safety net.
    // Try every candidate. One of them will answer even if the other is
    // blocked, and the first success decides the status shown to the user.
    // Only one request per address, so an action is never counted twice.
    let anyOk = false;
    const tries = STATS_CANDIDATES.map(base =>
      fetch(base, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=UTF-8" },
        body,
        keepalive: true,
      }).then(res => {
        if (res.ok){
          anyOk = true;
          lastReport = { at: Date.now(), ok: true, detail: "ok" };
          renderReportStatus();
        }
        return res.ok;
      }).catch(() => false)
    );
    Promise.all(tries).then(() => {
      if (!anyOk){
        lastReport = { at: Date.now(), ok: false, detail: "所有地址均不可达" };
        renderReportStatus();
      }
    });
  } catch (e) {
    // Reporting is optional; never let it break the tool.
    lastReport = { at: Date.now(), ok: false, detail: String(e && e.message ? e.message : e) };
    renderReportStatus();
  }
}

// Check which reporting address answers, so a blocked one is easy to spot.
async function runDiagnostics(){
  const out = document.getElementById("diagOut");
  out.textContent = "检测中…";
  const lines = [];
  for (const base of STATS_CANDIDATES){
    const url = base.replace("/api/log", "/api/health");
    const t0 = Date.now();
    try {
      const res = await fetch(url, { method: "GET", cache: "no-store" });
      lines.push((res.ok ? "✓" : "✗") + " " + url + " → HTTP " + res.status + " (" + (Date.now() - t0) + "ms)");
    } catch (e){
      lines.push("✗ " + url + " → " + (e && e.message ? e.message : String(e)));
    }
  }
  out.textContent = lines.join("\n");
}

// A small note in the footer, so a broken report is visible rather than silent.
function renderReportStatus(){
  const el = document.getElementById("reportStatus");
  if (!el) return;
  if (!lastReport.at){ el.textContent = ""; el.className = ""; return; }
  if (lastReport.ok){
    el.textContent = "✓ 统计已上报";
    el.className = "ok";
  } else {
    el.textContent = "⚠ 统计未送达 (" + lastReport.detail + ")";
    el.className = "bad";
  }
}

// ---- Date part inputs: digits only, with real calendar validation ----
const TODAY = new Date();
const MAX_YEAR = TODAY.getFullYear() + 10;
const MIN_YEAR = 1900;

function daysInMonth(y, m){
  if (m < 1 || m > 12) return 0;
  return new Date(y, m, 0).getDate(); // day 0 of next month = last day of this month
}

// Strip every non-digit; used on both paste and keystroke.
function digitsOnly(el){
  const v = el.value.replace(/\D/g, "");
  if (v !== el.value) el.value = v;
  return v;
}

// Validate a day/month/year group. Only the date of birth uses these inputs.
function validateDateGroup(group){
  const dEl = group.querySelector(".dd"), mEl = group.querySelector(".mm"), yEl = group.querySelector(".yy");
  const ds = digitsOnly(dEl), ms = digitsOnly(mEl), ys = digitsOnly(yEl);
  const d = ds === "" ? NaN : parseInt(ds, 10);
  const m = ms === "" ? NaN : parseInt(ms, 10);
  const y = ys === "" ? NaN : parseInt(ys, 10);
  const parts = [dEl, mEl, yEl];

  let msg = "";
  if (ds === "" || ms === "" || ys === ""){
    msg = t("errDobIncomplete");
  } else if (m < 1 || m > 12){
    msg = t("errMonthRange", {m});
  } else if (y < MIN_YEAR || y > MAX_YEAR){
    msg = t("errYearRange", {min: MIN_YEAR, max: MAX_YEAR, y});
  } else if (d < 1 || d > daysInMonth(y, m)){
    msg = t("errDayRange", {y, m, d: daysInMonth(y, m), d2: d});
  } else if (d > TODAY.getDate() && m === TODAY.getMonth() + 1 && y === TODAY.getFullYear()){
    msg = t("errDobToday");
  } else if (y > TODAY.getFullYear()){
    msg = t("errDobFuture");
  }

  const bad = !!msg;
  group.classList.toggle("bad", bad);
  const labels = group.querySelectorAll("small");
  const units = [t("unitDay"), t("unitMonth"), t("unitYear")];
  labels.forEach((s, i) => { s.textContent = bad && i === 0 ? msg : units[i]; });
  return { ok: !bad, msg, d, m, y, raw: { d: ds, m: ms, y: ys } };
}

function bindDateInputs(row){
  row.querySelectorAll(".dt").forEach(group => {
    const inputs = group.querySelectorAll("input");
    inputs.forEach((el, idx) => {
      el.addEventListener("input", () => {
        digitsOnly(el);
        // auto-advance: day(2) -> month -> year
        if (el.value.length === el.maxLength && idx < inputs.length - 1) inputs[idx + 1].focus();
        validateDateGroup(group);
        invalidate();
      });
      el.addEventListener("blur", () => validateDateGroup(group));
      el.addEventListener("paste", e => {
        e.preventDefault();
        const t = (e.clipboardData || window.clipboardData).getData("text").replace(/\D/g, "");
        const max = el.maxLength;
        el.value = t.slice(0, max);
        validateDateGroup(group);
        invalidate();
      });
      el.addEventListener("keydown", e => {
        if (e.key === "Enter"){ e.preventDefault(); inputs[Math.min(idx + 1, inputs.length - 1)].focus(); }
      });
    });
  });
}
const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

// English short month names, as the hotel expects them.
const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

// DD-Mon-YYYY, e.g. 02-Nov-2026
function fmtDateEn(d, m, y){
  return `${String(d).padStart(2,"0")}-${MONTHS[m - 1]}-${y}`;
}
// DD-Mon, e.g. 13-Nov
function fmtDateShort(d, m){
  return `${String(d).padStart(2,"0")}-${MONTHS[m - 1]}`;
}

function collect(){
  const code = $("rc").value.trim();
  const errors = [];
  const guests = [];
  [...rows.children].forEach((grp, gi) => {
    const groupNo = gi + 1;
    const adRaw = grp.querySelector(".ad").value;
    const at = grp.querySelector(".at").value;
    const groupRows = [...grp.querySelectorAll(".guest")];
    groupRows.forEach((r, ri) => {
      const who = groupRows.length > 1
        ? t("errGroupGuest", {n: groupNo, g: ri + 1})
        : t("errGroup", {n: groupNo});
      const dob = validateDateGroup(r.querySelector(".dob-dt"));
      const name = r.querySelector(".gn").value.trim();
      if (!name) errors.push(`${who}: ${t("errNoName")}`);
      if (!dob.ok) errors.push(`${who} · ${t("errDobLabel")}: ${dob.msg}`);
      if (!adRaw) errors.push(`${who} · ${t("errArrivalLabel")}: ${t("errNoArrival")}`);
      // Keep the raw yyyy-mm-dd so the subject can be built with a short date.
      const adParts = adRaw ? adRaw.split("-").map(Number) : null;
      guests.push({
        name,
        dob: dob.ok ? fmtDateEn(dob.d, dob.m, dob.y) : "",
        ad: adParts ? fmtDateEn(adParts[2], adParts[1], adParts[0]) : "",
        adShort: adParts ? fmtDateShort(adParts[2], adParts[1]) : "",
        at
      });
    });
  });
  if (!code) errors.push(t("errNoCode"));
  return { code, guests, errors };
}

function buildTable(code, guests){
  // The table header is fixed: English on top, Vietnamese underneath.
  const th = (en, vi) => `<th style="border:1px solid #333;padding:8px 10px;text-align:center;font-weight:700">${en}<br><i style="font-weight:400">${vi}</i></th>`;
  const td = t => `<td style="border:1px solid #333;padding:8px 10px;text-align:center">${t}</td>`;
  let h = `<table style="border-collapse:collapse;width:100%;font-family:Calibri,Arial,sans-serif;font-size:14px"><thead><tr>` +
    th("Representative Code","Mã Đại Diện") + th("Guest Name","Họ &amp; Tên Khách Hàng") +
    th("Date of Birth","Ngày tháng năm sinh") + th("Arrival Date/ Time","Ngày / Giờ đến") + `</tr></thead><tbody>`;
  guests.forEach(g => {
    h += `<tr>${td(esc(code))}${td(esc(g.name))}${td(g.dob)}${td(g.ad + (g.at ? `<br>${g.at}` : ""))}</tr>`;
  });
  return h + `</tbody></table>`;
}

// The mail body only carries a short greeting. The guest table is pasted
// from the clipboard, so it must not be duplicated here as plain text.
function buildBody(){
  return `${t("mailGreeting")}\n\n${t("mailIntro")}\n\n${t("mailSign")}`;
}

// The clipboard carries the table itself: HTML for rich mail clients, and a
// plain-text rendering of the same table as a fallback.
function buildTableText(guests){
  return guests.map(g => `${g.name} | ${g.dob} | ${g.ad}${g.at ? " " + g.at : ""}`).join("\n");
}

$("gen").onclick = () => {
  const { code, guests, errors } = collect();
  if (errors.length){
    $("err").innerHTML = errors.map(e => `• ${esc(e)}`).join("<br>");
    $("pv").classList.add("hide");
    invalidate();
    return;
  }
  $("err").textContent = "";
  // Subject uses the short form, e.g. "13-Nov". With several arrival dates,
  // list them all so the front desk is not left guessing. The first guest's
  // name follows the representative code.
  const shortDates = [...new Set(guests.map(g => g.adShort).filter(Boolean))];
  const firstName = guests[0] && guests[0].name ? guests[0].name : "";
  const subject = `${code}${firstName ? " " + firstName : ""} ${t("subjNewMember")} ${shortDates.join(", ")}`;
  const html = buildTable(code, guests);
  current = { code, guests, subject, html, text: buildBody() };
  reportUsage("generate", guests.length, new Set(guests.map(g => g.adShort)).size);
  $("to").textContent = TO;
  $("subj").textContent = subject;
  $("paper").innerHTML = html;
  $("pv").classList.remove("hide");
  $("send").disabled = false;
  $("pv").scrollIntoView({ behavior: "smooth", block: "nearest" });
};

let dl = null;
// Some hosts expose a downloads API; plain browsers fall back to the anchor download below.
(async () => { try { dl = (window.claude && typeof window.claude.use === "function") ? await window.claude.use("downloads") : null; } catch (e) { dl = null; } $("png").classList.remove("hide"); })();

function tablePNG(code, guests){
  const S = 2, cols = [170, 220, 170, 190], W = cols.reduce((a,b) => a + b, 0);
  const heads = [["Representative Code","Mã Đại Diện"],["Guest Name","Họ & Tên Khách Hàng"],["Date of Birth","Ngày tháng năm sinh"],["Arrival Date/ Time","Ngày / Giờ đến"]];
  const hasTime = guests.some(g => g.at), headH = 58, rowH = hasTime ? 54 : 38;
  const c = document.createElement("canvas");
  c.width = W * S; c.height = (headH + rowH * guests.length) * S;
  const x = c.getContext("2d"); x.scale(S, S);
  x.fillStyle = "#fff"; x.fillRect(0, 0, W, c.height / S);
  x.strokeStyle = "#333"; x.lineWidth = 1; x.fillStyle = "#111"; x.textAlign = "center"; x.textBaseline = "middle";
  const F = "Calibri, Arial, sans-serif";
  let px = 0;
  cols.forEach((w, i) => {
    x.font = `bold 14px ${F}`; x.fillText(heads[i][0], px + w/2, 20);
    if (heads[i][1] !== heads[i][0]){
      x.font = `italic 14px ${F}`; x.fillText(heads[i][1], px + w/2, 40);
    }
    guests.forEach((g, r) => {
      const cy = headH + r * rowH + rowH / 2;
      x.font = `14px ${F}`;
      const vals = [[code],[g.name],[g.dob],[g.ad, g.at].filter(Boolean)][i];
      vals.forEach((v, k) => x.fillText(v, px + w/2, cy + (k - (vals.length - 1) / 2) * 18));
    });
    px += w;
  });
  for (let i = 0; i <= cols.length; i++) { const lx = cols.slice(0, i).reduce((a,b) => a + b, 0) + .5; x.beginPath(); x.moveTo(lx, .5); x.lineTo(lx, c.height / S); x.stroke(); }
  for (let r = 0; r <= guests.length + 1; r++) { const ly = (r === 0 ? 0 : headH + (r - 1) * rowH) + .5; x.beginPath(); x.moveTo(0, ly); x.lineTo(W, ly); x.stroke(); }
  return new Promise(res => c.toBlob(res, "image/png"));
}

$("png").onclick = async () => {
  if (!current) return;
  try {
    // Re-read the fields so a PNG always matches what is on screen, but keep the
    // validated dates captured at preview time.
    const code = $("rc").value.trim() || current.code;
    const live = collect();
    const guests = live.guests.map((g, i) => ({
      name: g.name,
      dob: g.dob || (current.guests[i] && current.guests[i].dob) || "",
      ad: g.ad || (current.guests[i] && current.guests[i].ad) || "",
      at: g.at
    }));
    const blob = await tablePNG(code, guests);
    const filename = `${code}-arrival-table.png`;
    if (dl) { await dl.save({ filename, data: blob }); }
    else {
      const u = URL.createObjectURL(blob), a = document.createElement("a");
      a.href = u; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(u), 1000);
    }
  } catch (e) {
    if (!e || e.code !== "declined") $("err").textContent = t("pngFail");
  }
};

  }
};

$("mailtoLink").onclick = (e) => {
  // Keep the default mailto: behaviour, but stop the page from navigating away.
  e.preventDefault();
  window.location.href = $("mailtoLink").href;
};

// Detect browsers that cannot handle mailto: (WeChat / DingTalk / QQ in-app, most Android without a mail app)
function mailtoSupported(){
  const ua = navigator.userAgent || "";
  if (/MicroMessenger|DingTalk|QQ\/|Weibo|Alipay/i.test(ua)) return false;
  if (/Android/i.test(ua) && !/Chrome|Mobile Safari/i.test(ua)) return false;
  return true;
}

function showManualPanel(){
  $("manual").classList.remove("hide");
  const link = $("mailtoLink");
  link.href = `mailto:${TO}?subject=${encodeURIComponent(current.subject)}&body=${encodeURIComponent(current.text)}`;
  $("manualBody").value = buildTableText(current.guests);
  $("manualBody").focus();
  $("manualBody").select();
  $("manual").scrollIntoView({ behavior: "smooth", block: "nearest" });
}

$("send").onclick = async () => {
  if (!current) return;
  const btn = $("send");
  btn.disabled = true;
  let copied = false;
  reportUsage("send", current.guests.length, new Set(current.guests.map(g => g.adShort)).size);
  try {
    const blobH = new Blob([current.html], { type: "text/html" });
    const blobT = new Blob([buildTableText(current.guests)], { type: "text/plain" });
    await navigator.clipboard.write([new ClipboardItem({ "text/html": blobH, "text/plain": blobT })]);
    copied = true;
  } catch (e) {
    // Clipboard API needs a secure context and a user gesture; fall back to a selectable textarea.
  }
  $("err").textContent = "";
  $("manual").classList.add("hide");

  if (!mailtoSupported()){
    showManualPanel();
    $("err").textContent = copied ? t("noMailApp") : t("noMailAppNoCopy");
    btn.disabled = false;
    return;
  }

  const url = `mailto:${TO}?subject=${encodeURIComponent(current.subject)}&body=${encodeURIComponent(current.text)}`;
  // No target=_blank: in-app browsers and mobile Chrome drop mailto: links that open a new tab.
  window.location.href = url;
  btn.disabled = false;
  if (!copied) showManualPanel();
};
</script>
